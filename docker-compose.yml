services:
  # -------------------------------------------------------
  # سرویس ۱: وب‌سایت (Flask + SSE)
  # پورت اختصاصی بدون تداخل: 58291
  # -------------------------------------------------------
  web:
    build: .
    container_name: Lyraz_web_local
    restart: always
    command: gunicorn --worker-class gevent --workers 1 --threads 100 --bind 0.0.0.0:5000 app:app
    ports:
      - "58291:5000"
    volumes:
      - .:/app
    env_file: .env

  # -------------------------------------------------------
  # سرویس ۲: ربات تلگرام
  # اجرای Polling بدون نیاز به پورت باز ورودی
  # -------------------------------------------------------
  bot:
    build: .
    container_name: Lyraz_bot_local
    restart: always
    command: python bot_runner.py
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - web

  # -------------------------------------------------------
  # سرویس ۳: کارگر (Worker)
  # پردازش پس‌زمینه و دانلود متادیتا/آهنگ
  # -------------------------------------------------------
  worker:
    build: .
    container_name: Lyraz_worker_local
    restart: always
    command: nice -n 19 python worker.py
    volumes:
      - .:/app
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1500M
    depends_on:
      - web

  # -------------------------------------------------------
  # سرویس ۴: پرووایدر توکن یوتیوب (PO Token Provider)
  # -------------------------------------------------------
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: Lyraz_pot
    restart: unless-stopped
    ports:
      - "4416:4416"